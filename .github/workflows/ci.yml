name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      size_base:
        description: Base commit or ref for the size comparison
        required: true
        type: string
      codeql_debug:
        description: Retain native CodeQL tracer logs and databases for diagnosis
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  TOOLCHAINS: com.apple.dt.toolchain.Xcode
defaults:
  run:
    shell: bash
jobs:
  quality:
    name: Quality
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/*.zip
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/toolchain.env') }}
      - run: scripts/setup
      - run: scripts/quality
      - run: scripts/conventions
      - run: scripts/check-repository
      - run: python3 -B -m unittest discover -s tests -p 'test_codeql_coverage.py'
  build:
    name: Build and Tests
    runs-on: macos-26
    timeout-minutes: 30 # Allows a cold download if the pinned simulator runtime is absent.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/DerivedData
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/toolchain.env', '**/Package.resolved', '**/project.pbxproj') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/toolchain.env', '**/Package.resolved', '**/project.pbxproj') }}-
      - run: scripts/test-planner
      - run: scripts/test-planner release
      - run: scripts/test-dsp
      - run: scripts/test-audio
      - run: scripts/test-audio release
        env:
          LOWLIGHT_AUDIO_OUTPUT: ${{ github.workspace }}/.build/tonal-native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-tonal-candidates
          path: .build/tonal-native
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - run: scripts/build test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simulator-results
          path: .build/DerivedData/Logs/Test/*.xcresult
          include-hidden-files: true
          if-no-files-found: error
  audio:
    name: Audio Regression
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
          pip-version: '26.2.2'
          cache: pip
          cache-dependency-path: tools/reference/requirements.lock
      - run: scripts/verify-bank
      - run: python tools/reference/check.py --integrity
      - run: python tools/reference/verify-tonal.py --integrity
      - run: python tools/reference/verify-voices.py --integrity
      - run: python tools/reference/verify-bass.py --integrity
      - run: python tools/reference/verify-percussion.py --integrity
      - run: python tools/reference/verify-grammar.py
      - run: python tools/reference/verify-events.py
      - run: python -m pip install --require-hashes -r tools/reference/requirements.lock
      - run: python tools/reference/check.py --render
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-tonal-candidates
          path: .build/tonal-native
      - run: |
          python tools/reference/verify-tonal.py --compare .build/tonal-native --evidence .build/tonal-evidence
          python tools/reference/verify-voices.py --compare .build/tonal-native/voices --evidence .build/tonal-evidence/voices
          python tools/reference/verify-bass.py --compare .build/tonal-native/bass --evidence .build/tonal-evidence/bass
          python tools/reference/verify-percussion.py --compare .build/tonal-native/percussion --evidence .build/tonal-evidence/percussion
          cp .build/tonal-native/profile.json .build/tonal-evidence/profile.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tonal-preparation-comparison
          path: .build/tonal-evidence
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  size:
    name: Size Budget
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/build release
      - name: Compare identical unsigned Release device builds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.size_base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          app=.build/DerivedData/Build/Products/Release-iphoneos/Lowlight.app
          base_args=()
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'A real comparison base is required.' >&2
            exit 1
          fi
          base_commit=$(git rev-parse --verify --end-of-options "$BASE_SHA^{commit}")
          base=$(git merge-base "$base_commit" "$HEAD_SHA")
          if git cat-file -e "$base:Lowlight.xcodeproj/project.pbxproj" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/size-base" "$base"
            xcodebuild -quiet -project "$RUNNER_TEMP/size-base/Lowlight.xcodeproj" \
              -scheme Lowlight -configuration Release -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/size-base-derived" \
              ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
            base_args+=("$RUNNER_TEMP/size-base-derived/Build/Products/Release-iphoneos/Lowlight.app" "$base")
          elif [[ -n "$(git ls-tree "$base")" ]]; then
            echo 'Missing base project in a nonempty tree; investigate before comparing size.' >&2
            exit 1
          fi
          result=0
          scripts/size-report "$app" "${base_args[@]}" > .build/size-report.json 2> .build/size-summary.txt || result=$?
          cat .build/size-summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unsigned-size-report
          path: .build/size-*
          include-hidden-files: true
          if-no-files-found: error
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # Leave headroom for both native extractors and a cold clean build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: native
            languages: swift,cpp
            # This opaque comparison key preserves the existing Swift baseline.
            category: swift
            os: macos-26-intel
            bundle: osx64
          - language: python
            languages: python
            category: python
            os: ubuntu-24.04
            build-mode: none
            bundle: linux64
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'native'
        run: scripts/toolchain
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.languages }}
          # The explicit native build traces both languages; build-mode is single-language-only.
          build-mode: ${{ matrix.build-mode }}
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.3/codeql-bundle-${{ matrix.bundle }}.tar.zst
          debug: ${{ matrix.language == 'native' && inputs.codeql_debug == true }}
          debug-artifact-name: codeql-debug-${{ matrix.language }}
      - name: Trace a fresh app build without compilation caches
        if: matrix.language == 'native'
        run: |
          xcodebuild -project Lowlight.xcodeproj -scheme Lowlight \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/codeql-derived" -showBuildTimingSummary clean build \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_COMPILE_CACHE=NO SWIFT_USE_INTEGRATED_DRIVER=NO
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        id: analyze
        with:
          category: /language:${{ matrix.category }}
      - name: Require app/package Swift sources and manifests in the extracted database
        if: matrix.language == 'native'
        env:
          DATABASE: ${{ fromJSON(steps.analyze.outputs.db-locations).swift }}
        run: |
          "$CODEQL_DIST/codeql" bqrs decode --format=json --entities=string \
            "$DATABASE/results/codeql/swift-queries/diagnostics/ExtractedFiles.bqrs" \
            > "$RUNNER_TEMP/codeql-swift-extracted-files.json"
          scripts/verify-codeql-coverage.py "$RUNNER_TEMP/codeql-swift-extracted-files.json"
      - name: Require the C++ kernel and public headers in the extracted database
        if: matrix.language == 'native'
        env:
          DATABASE: ${{ fromJSON(steps.analyze.outputs.db-locations).cpp }}
        run: |
          "$CODEQL_DIST/codeql" bqrs decode --format=json --entities=string \
            "$DATABASE/results/codeql/cpp-queries/Diagnostics/ExtractedFiles.bqrs" \
            > "$RUNNER_TEMP/codeql-cpp-extracted-files.json"
          scripts/verify-codeql-coverage.py "$RUNNER_TEMP/codeql-cpp-extracted-files.json" --language cpp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.language == 'native'
        with:
          name: swift-extraction-inventory
          path: ${{ runner.temp }}/codeql-swift-extracted-files.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.language == 'native'
        with:
          name: cpp-extraction-inventory
          path: ${{ runner.temp }}/codeql-cpp-extracted-files.json
          retention-days: 7
          if-no-files-found: error
  gate:
    name: CI Gate
    if: always()
    needs: [quality, build, audio, size, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'length == 5 and all(.[]; .result == "success")'
